<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/logo.svg">

    <link rel="stylesheet" href="./assets/styles/standard.css">
    <link rel="stylesheet" href="./assets/styles/bg.css">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./assets/styles/media.css">

    <script src="./assets/scripts/templates.js"></script>
    <script src="./script.js" defer></script>
</head>

<body onload="init()" id="page-body">
    <header class="page_header">
        <div class="page_header_logo">
            <img src="./assets/icons/logo.svg" alt="Pokedex Logo">
            <h1>Pokedex</h1>
        </div>
        <div class="page_header_search">
            <div>
                <input type="text" id="search-input" class="search_input" placeholder=" search ...">
            <p id="error-message" class="error_message d_none">More input needed</p>
            <p id="not-found-message" class="error_message d_none">No matches found</p>
            </div>
            <button onclick="filterCards()">Filter</button>
            <button onclick="showAllCards()">Show all</button>
        </div>
    </header>
    <main class="page_main">
        <section id="content" class="content_section">
            <img id="loading-spinner" class="loading_spinner d_none" src="./assets/icons/loading.svg"
                alt="Loading Spinner">
        </section>
        

        <dialog id="dialog">
        </dialog>
    </main>
    <div class="load_btn_section"><button id="load-btn" class="button_load" onclick="loadMoreCards()">Load more</button></div>
    <footer class="page_footer">
    </footer>

</body>

</html>
