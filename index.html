<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/logo.svg">

    <link rel="stylesheet" href="./assets/styles/standard.css">
    <link rel="stylesheet" href="./assets/styles/bg.css">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <link rel="stylesheet" href="./assets/styles/media.css">
    <link rel="stylesheet" href="style.css">

    <script src="./assets/scripts/templates.js"></script>
    <script src="./script.js" defer></script>
</head>

<body onload="init()">
    <header class="page_header">
        <div class="page_header_logo">
            <img src="./assets/icons/logo.svg" alt="Pokedex Logo">
            <h1>Pokedex</h1>
        </div>
        <div>
            <input type="text" id="search-input" placeholder=" search ...">
            <p id="error-message" class="error_message hide_error">at least 3 characters</p>
            <button onclick="filterCards()">Filter</button>
            <button onclick="showAllCards()">Show all</button>
        </div>
    </header>
    <main>
        <section id="content">
        
        </section>
        <button onclick="loadMoreCards()">Load more</button>
        <img id="loading-spinner" class="loading_spinner d_none" src="./assets/icons/loading.svg" alt="Loading Spinner">
        <dialog id="dialog">
        </dialog>
    </main>

</body>

</html>
